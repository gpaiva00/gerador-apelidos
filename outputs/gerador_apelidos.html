<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fala aí, meu...</title>
  <style>
    :root { color-scheme: dark; --bg:#111315; --panel:#1b1f22; --line:#30363b; --text:#f4f5f6; --muted:#a8b0b6; --accent:#f5c451; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 0%, #252a2e 0, var(--bg) 55%); color:var(--text); font-family:"Avenir Next","Segoe UI",ui-sans-serif,system-ui,sans-serif; }
    main { width:min(100%, 560px); text-align:center; }
    h1 { margin:0 0 24px; font-size:clamp(2rem,7vw,3.4rem); letter-spacing:-.045em; font-weight:750; }
    .card { padding:34px 24px 26px; border:1px solid var(--line); border-radius:24px; background:rgba(27,31,34,.88); box-shadow:0 24px 70px rgba(0,0,0,.3); }
    #nickname { min-height:1.25em; margin:0 0 28px; color:var(--accent); font-size:clamp(2rem,10vw,5.2rem); line-height:1.08; letter-spacing:-.045em; font-weight:800; overflow-wrap:normal; word-break:normal; hyphens:none; }
    .actions { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .actions #draw { width:min(100%, 320px); }
    .actions #copy { width:min(100%, 190px); }
    button { border:0; border-radius:999px; padding:13px 20px; color:#161616; background:var(--accent); font:inherit; font-weight:800; cursor:pointer; transition:transform .15s ease, filter .15s ease; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:active { transform:translateY(1px); }
    button.secondary { color:var(--text); background:#2a3035; border:1px solid var(--line); }
    .categories { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:22px; }
    .category { border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--muted); background:transparent; font-size:.8rem; cursor:pointer; }
    .category.active { color:#171717; border-color:var(--accent); background:var(--accent); }
    .hint { margin:18px 0 0; color:var(--muted); font-size:.78rem; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main>
    <h1>Fala aí, meu...</h1>
    <section class="card" aria-live="polite">
      <p id="nickname">Big</p>
      <div class="actions">
        <button id="draw" type="button">Sortear apelido</button>
        <button id="copy" class="secondary" type="button">Copiar</button>
      </div>
      <div class="categories" aria-label="Categorias">
        <button class="category active" data-category="todos" type="button">Todos</button>
        <button class="category" data-category="classicos" type="button">Clássicos</button>
        <button class="category" data-category="respeito" type="button">Respeito</button>
        <button class="category" data-category="criativos" type="button">Criativos</button>
      </div>
      <p class="hint">Dica: pressione a barra de espaço para sortear</p>
    </section>
  </main>
  <script>
    const apelidos = {
      classicos: ['Big','Monstro','Mestre','Doutor','Maninho','Chefe','Patrão','Professor','Lenda','Craque','Campeão','Gigante','Brabo','Brabão','Rei','Ídolo','Figura','Parceiro','Comandante','Comandantezinho','Mago','Gênio','Fenômeno','Titã','Brutamontes','Camarada','Nobre','Capitão','Líder','Mandachuva'],
      respeito: ['Excelência','Doutor Honorário','Mestre Supremo','Grande Chefe','Professor Pardal','Senhor Respeito','Doutor do Rolê','Embaixador','Ministro','Conselheiro','Magnata','Presidente','Reitor','Diretor','Comandante Geral','Lenda Viva','Patrono','Catedrático','Especialista','Referência','Tubarão','Grande Mestre','Dono da Razão','Chefão','Rei do Pedaço'],
      criativos: ['Brabo do Café','Mestre do Atalho','Rei da Gambiarra','Capitão Planilha','Ninja do Teclado','Mago da Reunião','Samurai do Prazo','Lorde do Wi-Fi','Barão do Café','Comandante do Zoom','Almirante do E-mail','Oráculo','Usina de Ideias','Foguete','Máquina','Trem-Bala','Raio','Míssil','Turbo','Pilha Duracell','GPS Humano','Google da Firma','Sherlock','Arquiteto do Caos','Domador de Boletos','Senhor dos Prazos','Professor X','Agente Secreto','Cérebro','Mestre Jedi','Bruxo','Enciclopédia','Canivete Suíço','Homem-Agenda','Rei do Improviso']
    };
    const nickname = document.querySelector('#nickname');
    const draw = document.querySelector('#draw');
    const copy = document.querySelector('#copy');
    let categoria = 'todos';
    let recentes = [];
    const todos = () => categoria === 'todos' ? Object.values(apelidos).flat() : apelidos[categoria];
    function sortear() {
      const disponiveis = todos().filter(item => !recentes.includes(item));
      const lista = disponiveis.length ? disponiveis : todos();
      const escolhido = lista[Math.floor(Math.random() * lista.length)];
      nickname.textContent = escolhido;
      recentes = [escolhido, ...recentes.filter(item => item !== escolhido)].slice(0, Math.min(10, Math.floor(todos().length / 3)));
    }
    draw.addEventListener('click', sortear);
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && !event.repeat && !['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)) {
        event.preventDefault();
        sortear();
      }
    });
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(nickname.textContent); copy.textContent = 'Copiado!'; setTimeout(() => copy.textContent = 'Copiar', 1000); }
      catch { copy.textContent = 'Selecione o apelido'; setTimeout(() => copy.textContent = 'Copiar', 1200); }
    });
    document.querySelectorAll('.category').forEach(button => button.addEventListener('click', () => {
      categoria = button.dataset.category;
      document.querySelectorAll('.category').forEach(item => item.classList.toggle('active', item === button));
      recentes = [];
      sortear();
    }));
  </script>
</body>
</html>
