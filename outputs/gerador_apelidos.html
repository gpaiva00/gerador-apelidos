<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fala aí, meu...</title>
  <style>
    :root { color-scheme: dark; --bg:#111315; --panel:#1b1f22; --line:#30363b; --text:#f4f5f6; --muted:#a8b0b6; --accent:#f5c451; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 0%, #252a2e 0, var(--bg) 55%); color:var(--text); font-family:"Avenir Next","Segoe UI",ui-sans-serif,system-ui,sans-serif; }
    main { width:min(100%, 560px); text-align:center; }
    h1 { margin:0 0 24px; font-size:clamp(2rem,7vw,3.4rem); letter-spacing:-.045em; font-weight:750; }
    .card { padding:34px 24px 26px; border:1px solid var(--line); border-radius:24px; background:rgba(27,31,34,.88); box-shadow:0 24px 70px rgba(0,0,0,.3); }
    #nickname { min-height:1.25em; margin:0 0 28px; color:var(--accent); font-size:clamp(2rem,10vw,5.2rem); line-height:1.08; letter-spacing:-.045em; font-weight:800; overflow-wrap:normal; word-break:normal; hyphens:none; }
    .actions { display:flex; justify-content:center; align-items:center; gap:10px; }
    .actions #draw { width:min(100%, 320px); }
    .actions #copy { width:50px; height:50px; padding:0; display:grid; place-items:center; }
    #copy svg { width:21px; height:21px; }
    button { border:0; border-radius:999px; padding:13px 20px; color:#161616; background:var(--accent); font:inherit; font-weight:800; cursor:pointer; transition:transform .15s ease, filter .15s ease; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:disabled { cursor:wait; opacity:.65; transform:none; }
    button:active { transform:translateY(1px); }
    button.secondary { color:var(--text); background:#2a3035; border:1px solid var(--line); }
    .categories { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:22px; }
    .category { border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:var(--muted); background:transparent; font-size:.8rem; cursor:pointer; }
    .category.active { color:#171717; border-color:var(--accent); background:var(--accent); }
    .hint { margin:16px 0 0; color:var(--muted); font-size:.78rem; }
    .suggest { margin-top:18px; color:var(--muted); background:none; border:0; padding:4px; font-size:.78rem; font-weight:600; cursor:pointer; }
    .suggest:hover { color:var(--accent); filter:none; transform:none; }
    dialog { width:min( calc(100% - 32px), 420px); padding:0; border:1px solid var(--line); border-radius:20px; color:var(--text); background:#1b1f22; box-shadow:0 24px 80px #000b; }
    dialog::backdrop { background:#0009; backdrop-filter:blur(4px); }
    .modal { padding:24px; }
    .modal h2 { margin:0 0 6px; font-size:1.3rem; }
    .modal p { margin:0 0 18px; color:var(--muted); font-size:.88rem; }
    .modal label { display:block; margin-bottom:7px; font-size:.85rem; font-weight:700; }
    .modal input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:11px; outline:0; color:var(--text); background:#111315; font:inherit; }
    .modal input:focus { border-color:var(--accent); }
    .modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
    .modal-actions button { padding:10px 15px; }
    .status { min-height:1.2em; margin-top:12px !important; color:var(--accent) !important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main>
    <h1>Fala aí, meu...</h1>
    <section class="card" aria-live="polite">
      <p id="nickname">Big</p>
      <div class="actions">
        <button id="draw" type="button">Sortear apelido</button>
        <button id="copy" class="secondary" type="button" aria-label="Copiar apelido" title="Copiar apelido">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
      <div class="categories" aria-label="Categorias">
        <button class="category active" data-category="todos" type="button">Todos</button>
        <button class="category" data-category="classicos" type="button">Clássicos</button>
        <button class="category" data-category="respeito" type="button">Respeito</button>
        <button class="category" data-category="criativos" type="button">Criativos</button>
      </div>
      <button class="suggest" id="open-suggest" type="button">Sugerir um apelido</button>
    </section>
    <p class="hint">Dica: pressione a barra de espaço para sortear</p>
  </main>
  <dialog id="suggest-dialog">
    <form class="modal" id="suggest-form" method="dialog">
      <h2>Sugerir apelido</h2>
      <p>Envie uma ideia para entrar na lista de sugestões.</p>
      <label for="suggestion">Seu apelido</label>
      <input id="suggestion" name="suggestion" maxlength="50" autocomplete="off" required placeholder="Ex.: Rei do Café">
      <p class="status" id="suggest-status" aria-live="polite"></p>
      <div class="modal-actions">
        <button class="secondary" id="close-suggest" type="button">Cancelar</button>
        <button id="submit-suggest" type="submit">Sugerir</button>
      </div>
    </form>
  </dialog>
  <script>
    const SUGGESTION_API_URL = 'https://gerador-apelidos-backend.vercel.app/api/sugerir';
    const apelidos = {
      classicos: ['Big','Monstro','Mestre','Doutor','Maninho','Chefe','Patrão','Professor','Lenda','Craque','Campeão','Gigante','Brabo','Brabão','Rei','Ídolo','Figura','Parceiro','Comandante','Comandantezinho','Mago','Gênio','Fenômeno','Titã','Brutamontes','Camarada','Nobre','Capitão','Líder','Mandachuva'],
      respeito: ['Excelência','Doutor Honorário','Mestre Supremo','Grande Chefe','Professor Pardal','Senhor Respeito','Doutor do Rolê','Embaixador','Ministro','Conselheiro','Magnata','Presidente','Reitor','Diretor','Comandante Geral','Lenda Viva','Patrono','Catedrático','Especialista','Referência','Tubarão','Grande Mestre','Dono da Razão','Chefão','Rei do Pedaço'],
      criativos: ['Brabo do Café','Mestre do Atalho','Rei da Gambiarra','Capitão Planilha','Ninja do Teclado','Mago da Reunião','Samurai do Prazo','Lorde do Wi-Fi','Barão do Café','Comandante do Zoom','Almirante do E-mail','Oráculo','Usina de Ideias','Foguete','Máquina','Trem-Bala','Raio','Míssil','Turbo','Pilha Duracell','GPS Humano','Google da Firma','Sherlock','Arquiteto do Caos','Domador de Boletos','Senhor dos Prazos','Professor X','Agente Secreto','Cérebro','Mestre Jedi','Bruxo','Enciclopédia','Canivete Suíço','Homem-Agenda','Rei do Improviso']
    };
    const nickname = document.querySelector('#nickname');
    const draw = document.querySelector('#draw');
    const copy = document.querySelector('#copy');
    const suggestDialog = document.querySelector('#suggest-dialog');
    const suggestForm = document.querySelector('#suggest-form');
    const suggestion = document.querySelector('#suggestion');
    const suggestStatus = document.querySelector('#suggest-status');
    const submitSuggest = document.querySelector('#submit-suggest');
    const copyIcon = copy.innerHTML;
    const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>';
    let categoria = 'todos';
    let recentes = [];
    const todos = () => categoria === 'todos' ? Object.values(apelidos).flat() : apelidos[categoria];
    function sortear() {
      const disponiveis = todos().filter(item => !recentes.includes(item));
      const lista = disponiveis.length ? disponiveis : todos();
      const escolhido = lista[Math.floor(Math.random() * lista.length)];
      nickname.textContent = escolhido;
      recentes = [escolhido, ...recentes.filter(item => item !== escolhido)].slice(0, Math.min(10, Math.floor(todos().length / 3)));
    }
    draw.addEventListener('click', sortear);
    document.querySelector('#open-suggest').addEventListener('click', () => { suggestStatus.textContent = ''; suggestion.value = ''; suggestDialog.showModal(); setTimeout(() => suggestion.focus(), 50); });
    document.querySelector('#close-suggest').addEventListener('click', () => suggestDialog.close());
    suggestForm.addEventListener('submit', async event => {
      event.preventDefault();
      const apelido = suggestion.value.trim();
      if (!apelido) return;
      const payload = { apelido, data: new Date().toISOString(), status: 'Pendente' };
      submitSuggest.disabled = true;
      submitSuggest.textContent = 'Enviando...';
      try {
        if (SUGGESTION_API_URL) {
          const resposta = await fetch(SUGGESTION_API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
          const resultado = await resposta.json();
          if (!resposta.ok || !resultado.ok) throw new Error(resultado.erro || 'Não foi possível enviar.');
        } else {
          const pendentes = JSON.parse(localStorage.getItem('apelidos-pendentes') || '[]');
          localStorage.setItem('apelidos-pendentes', JSON.stringify([...pendentes, payload]));
        }
        suggestStatus.textContent = 'Sugestão enviada!';
        suggestion.value = '';
        setTimeout(() => suggestDialog.close(), 900);
      } catch { suggestStatus.textContent = 'Não foi possível enviar. Tente novamente.'; }
      finally { submitSuggest.disabled = false; submitSuggest.textContent = 'Sugerir'; }
    });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && !event.repeat && !['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)) {
        event.preventDefault();
        sortear();
      }
    });
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(`Fala aí, meu ${nickname.textContent}`); copy.innerHTML = checkIcon; copy.setAttribute('aria-label', 'Copiado!'); copy.setAttribute('title', 'Copiado!'); setTimeout(() => { copy.innerHTML = copyIcon; copy.setAttribute('aria-label', 'Copiar apelido'); copy.setAttribute('title', 'Copiar apelido'); }, 1000); }
      catch { copy.setAttribute('aria-label', 'Não foi possível copiar'); copy.setAttribute('title', 'Não foi possível copiar'); setTimeout(() => { copy.setAttribute('aria-label', 'Copiar apelido'); copy.setAttribute('title', 'Copiar apelido'); }, 1200); }
    });
    document.querySelectorAll('.category').forEach(button => button.addEventListener('click', () => {
      categoria = button.dataset.category;
      document.querySelectorAll('.category').forEach(item => item.classList.toggle('active', item === button));
      recentes = [];
      sortear();
    }));
  </script>
</body>
</html>
